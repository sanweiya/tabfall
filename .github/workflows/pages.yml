name: Deploy to GitHub Pages

# Builds the static bundle in `dist/` and publishes it as a project site at
# https://sanweiya.github.io/tabfall/ — index.html only uses relative paths and
# the app derives its asset base from `document.baseURI`, so no basePath flag is
# needed. The e2e test is not run here: it needs a browser download and a live
# server, and it is documented as an optional local check.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the newest majors (2026-11): checkout/setup-node
      # v7, configure-pages v6, upload-pages-artifact v5, deploy-pages v5 all
      # run on the Node 24 runtime, which clears the deprecation warnings the
      # older node20-based majors raised on the 2026-10 runner image migration.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the bundle points at relative paths
        run: |
          test -f dist/index.html
          grep -q 'src="\./app.js"' dist/index.html
          test -f dist/assets/alphaTab.worker.js
          test -f dist/assets/soundfont/sonivox.sf2

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
